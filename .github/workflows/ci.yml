name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.8"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Shell syntax
        run: sh -n docker/build-acn-eval-amd64.sh
